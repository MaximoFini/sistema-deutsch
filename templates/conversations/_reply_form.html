{# Cuadro de respuesta compartido (preguntas y mensajes). Recibe text, error, max_length, connected, saved_replies, button y placeholder. #}
{% if error %}<div class="mb-3 rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800" role="alert">{{ error }}</div>{% endif %}
<form method="post" class="reply-form space-y-2">{% csrf_token %}
  {% if saved_replies %}
  <label class="block text-sm">
    <span class="text-stone-600">Insertar una respuesta guardada</span>
    <select class="saved-reply mt-1 w-full rounded border border-stone-300 px-2 py-2 text-sm">
      <option value="">Elegí una…</option>
      {% for r in saved_replies %}<option value="{{ r.pk }}" data-text="{{ r.text }}">{{ r.title }}</option>{% endfor %}
    </select>
  </label>
  {% endif %}
  <textarea name="text" rows="5" maxlength="{{ max_length }}" required placeholder="{{ placeholder }}" class="reply-text w-full rounded border border-stone-300 px-3 py-2 text-base">{{ text }}</textarea>
  <div class="flex flex-wrap items-center justify-between gap-2">
    <span class="text-xs text-stone-500"><span class="char-count">{{ text|length }}</span> / {{ max_length }} caracteres</span>
    <button class="min-h-[48px] w-full rounded bg-stone-900 px-6 py-3 font-medium text-white disabled:opacity-60 md:w-auto" {% if not connected %}disabled title="Mercado Libre está desconectado"{% endif %} data-busy="Enviando…">{{ button }}</button>
  </div>
</form>
<script>
(function () {
  document.querySelectorAll("form.reply-form").forEach(function (form) {
    var area = form.querySelector(".reply-text");
    var count = form.querySelector(".char-count");
    var select = form.querySelector(".saved-reply");
    var button = form.querySelector("button");
    function update() { count.textContent = area.value.length; }
    area.addEventListener("input", update);
    if (select) select.addEventListener("change", function () {
      var opt = select.options[select.selectedIndex];
      if (!opt.value) return;
      var text = opt.getAttribute("data-text");
      area.value = area.value.trim() ? area.value.replace(/\s+$/, "") + "\n" + text : text;
      select.selectedIndex = 0;
      update();
      area.focus();
    });
    // Un solo envío (como en M5): el doble clic mandaba el mismo mensaje dos veces al comprador.
    // El servidor también frena el repetido; esto evita el segundo POST.
    var sending = false;
    form.addEventListener("submit", function (e) {
      if (sending || button.disabled) { e.preventDefault(); return; }
      sending = true;
      // Se deshabilita después de armar el envío, igual que en despacho.
      setTimeout(function () { button.disabled = true; button.textContent = button.dataset.busy; }, 0);
    });
  });
  // Al volver con «Atrás» el navegador puede mostrar la página vieja con el botón trabado.
  window.addEventListener("pageshow", function (e) { if (e.persisted) location.reload(); });
})();
</script>
