{% extends "base.html" %}
{% block title %}Editar respuesta guardada · Mercado Libre{% endblock %}
{% block content %}
<a href="{% url 'ml:saved_replies' %}" class="text-sm underline">← Respuestas guardadas</a>
<section class="mt-2 max-w-xl rounded-lg border border-stone-200 bg-white p-4 text-sm">
  <h1 class="mb-2 text-lg font-semibold">Editar «{{ reply.title }}»</h1>
  <form method="post" class="space-y-2">{% csrf_token %}
    {% include "conversations/_saved_reply_fields.html" %}
    <button class="min-h-[44px] w-full rounded bg-stone-900 px-4 py-2 font-medium text-white md:w-auto">Guardar cambios</button>
  </form>
  <form method="post" class="mt-4 border-t border-stone-100 pt-3">{% csrf_token %}
    <button name="toggle" value="1" class="underline {% if reply.is_active %}text-red-700{% endif %}">{% if reply.is_active %}Dar de baja (deja de aparecer al responder){% else %}Volver a activar{% endif %}</button>
  </form>
</section>
{% endblock %}
