{# Pestañas de Preguntas. Recibe `tab`. #}
<div class="mb-4 flex flex-wrap gap-2 text-sm">
  <a href="{% url 'ml:questions' %}" class="rounded-full border px-3 py-1.5 {% if tab == 'unanswered' %}bg-stone-900 text-white{% endif %}">Sin responder</a>
  <a href="{% url 'ml:questions_answered' %}" class="rounded-full border px-3 py-1.5 {% if tab == 'answered' %}bg-stone-900 text-white{% endif %}">Respondidas</a>
  {% if perms.conversations.manage_saved_replies %}<a href="{% url 'ml:saved_replies' %}" class="rounded-full border px-3 py-1.5 {% if tab == 'saved' %}bg-stone-900 text-white{% endif %}">Respuestas guardadas</a>{% endif %}
</div>
