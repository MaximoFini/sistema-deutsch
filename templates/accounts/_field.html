<label class="block text-sm">
  <span class="text-stone-700">{{ field.label }}</span>
  <input type="{{ field.field.widget.input_type|default:'text' }}" name="{{ field.html_name }}" value="{{ field.value|default_if_none:'' }}" {% if field.field.required %}required{% endif %}
         class="mt-1 block w-full rounded border border-stone-300 px-3 py-2 focus:border-stone-500 focus:outline-none">
  {% for error in field.errors %}<span class="mt-1 block text-xs text-red-700">{{ error }}</span>{% endfor %}
</label>
