{% extends "base.html" %}
{% comment %}Base de las páginas de error (404, CSRF): no usa el usuario ni el menú, así funciona sin sesión.{% endcomment %}
{% block body %}
<main class="mx-auto mt-24 max-w-md px-4">
  <p class="mb-6 text-center text-2xl font-semibold tracking-tight">Deutsch</p>
  <div class="rounded-lg border border-stone-200 bg-white p-6 shadow-sm">
    {% block error %}{% endblock %}
    <a href="{% url 'core:home' %}" class="mt-4 inline-block rounded bg-stone-900 px-4 py-2 text-sm text-white">Volver al inicio</a>
  </div>
</main>
{% endblock %}
